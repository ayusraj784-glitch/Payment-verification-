<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>डांडिया नाइट सोना प्लेस</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background-image: url('https://i.ibb.co/xKz3KSSy/IMG-20260920-224029.jpg');
      background-size: cover; background-position: center; background-attachment: fixed; background-repeat: no-repeat;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .container {
      width: 100%; max-width: 420px; background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px); border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    h1 { text-align: center; color: #c2185b; margin-bottom: 18px; font-size: 24px; }
    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; color: #333; font-size: 14px; }
    input, select {
      width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; background: #fff;
    }
    input:focus, select:focus { border-color: #c2185b; }
    .btn {
      width: 100%; padding: 12px; background-color: #c2185b; color: #fff; border: none; border-radius: 8px;
      font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: background 0.3s;
    }
    .btn:hover { background-color: #ad1457; }
    .pay-card { text-align: center; border: 1px dashed #c2185b; padding: 15px; border-radius: 10px; margin-bottom: 15px; background: #fff5f8; }
    .amount-box { font-size: 22px; font-weight: bold; color: #c2185b; margin: 8px 0; }
    .qr-box { width: 170px; height: 170px; margin: 10px auto; border: 2px solid #ddd; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #fff; }
    .qr-box img { width: 100%; height: 100%; object-fit: contain; }
    .success-msg { text-align: center; color: #2e7d32; font-weight: bold; font-size: 18px; margin-bottom: 15px; }
    .receipt { background: #f9f9f9; border: 1px solid #eee; border-radius: 8px; padding: 14px; margin-bottom: 15px; }
    .receipt-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 14px; }
    .receipt-row:last-child { border-bottom: none; }
    .btn-download { background-color: #2e7d32; }
    .btn-download:hover { background-color: #1b5e20; }
    @media print {
      body { visibility: hidden; }
      #success-screen, #success-screen * { visibility: visible; }
      #success-screen { position: absolute; left: 0; top: 0; width: 100%; background: white !important; }
    }
  </style>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

  <div class="container">
    <!-- 1. रजिस्ट्रेशन स्क्रीन -->
    <div id="reg-screen" class="screen active">
      <h1>डांडिया नाइट सोना प्लेस</h1>
      <form id="regForm" onsubmit="goToPayment(event)">
        <div class="form-group">
          <label>पूरा नाम:</label>
          <input type="text" id="name" placeholder="अपना नाम लिखें" required>
        </div>
        <div class="form-group">
          <label>ईमेल:</label>
          <input type="email" id="email" placeholder="अपना ईमेल लिखें" required>
        </div>
        <div class="form-group">
          <label>मोबाइल नंबर:</label>
          <input type="tel" id="mobile" placeholder="अपना 10 अंकों का मोबाइल नंबर" pattern="[0-9]{10}" required>
        </div>
        <div class="form-group">
          <label>गेस्ट की संख्या:</label>
          <select id="guests" required>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
          </select>
        </div>
        <button type="submit" class="btn">रजिस्टर करें</button>
      </form>
    </div>

    <!-- 2. पेमेंट स्क्रीन -->
    <div id="payment-screen" class="screen">
      <h1>पेमेंट करें</h1>
      <div class="pay-card">
        <p>कुल देय राशि:</p>
        <div class="amount-box" id="pay-amount"></div>
        <p style="font-size: 13px; color: #555;">पेमेंट गेटवे: <strong>PhonePe / UPI</strong></p>
        <div class="qr-box">
          <img src="https://i.ibb.co/MDB8G1S4/IMG-20260920-WA0010.jpg" alt="PhonePe QR Code">
        </div>
        <p style="font-size: 12px; color: #666; margin-top: 8px;">ऊपर दिए गए QR कोड को स्कैन करके पेमेंट पूरा करें।</p>
      </div>
      <button type="button" class="btn" onclick="processPayment()">मैंने पेमेंट कर दिया (Payment Done)</button>
    </div>

    <!-- 3. सफलता और रसीद स्क्रीन -->
    <div id="success-screen" class="screen">
      <h1>डांडिया नाइट सोना प्लेस</h1>
      <div class="success-msg">✨ पेमेंट सफल! आपका टिकट बुक हो गया है! 🎉</div>
      <div class="receipt">
        <div class="receipt-row"><strong>नाम:</strong> <span id="conf-name"></span></div>
        <div class="receipt-row"><strong>मोबाइल:</strong> <span id="conf-mobile"></span></div>
        <div class="receipt-row"><strong>गेस्ट संख्या:</strong> <span id="conf-guests"></span></div>
        <div class="receipt-row"><strong>इवेंट:</strong> <span>डांडिया नाइट सोना प्लेस</span></div>
        <div class="receipt-row"><strong>भुगतान स्थिति:</strong> <span style="color: #2e7d32; font-weight: bold;">सफल</span></div>
      </div>
      <button class="btn btn-download" onclick="window.print()">रसीद डाउनलोड करें (PDF)</button>
    </div>
  </div>

  <script>
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    let formData = {};

    function goToPayment(event) {
      event.preventDefault();
      formData.name = document.getElementById('name').value;
      formData.email = document.getElementById('email').value;
      formData.mobile = document.getElementById('mobile').value;
      formData.guests = parseInt(document.getElementById('guests').value, 10);
      
      const pricePerGuest = 500;
      const total = formData.guests * pricePerGuest;
      
      document.getElementById('pay-amount').innerText = '₹ ' + total;
      showScreen('payment-screen');
    }

    async function processPayment() {
      // यहाँ हम मान रहे हैं कि पेमेंट QR कोड से हो गया है। 
      // सर्वर वेरिफिकेशन की आवश्यकता नहीं है अगर आप खुद पेमेंट चेक कर रहे हैं।
      
      document.getElementById('conf-name').innerText = formData.name;
      document.getElementById('conf-mobile').innerText = formData.mobile;
      document.getElementById('conf-guests').innerText = formData.guests;
      
      showScreen('success-screen');
    }
  </script>
</body>
</html>
